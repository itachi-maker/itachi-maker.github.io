<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RendimientoTech - Optimización Profesional</title>
  <link rel="stylesheet" href="style.css">
</head>
<body id="inicio">

  <nav class="navbar">
    <div class="nav-container">
      <span class="nav-logo">⚡ RendimientoTech</span>
      <ul class="nav-links">
        <li><a href="#scriptgen">📦 Script Generador</a></li>
        <li><a href="javascript:void(0)" onclick="abrirModal('modalContacto')">📩 Contacto</a></li>
      </ul>
    </div>
  </nav>

  <header class="header-principal">
    <h1>RendimientoTech</h1>
    <p>Portal de Optimización Segura (Root & No-Root)</p>
  </header>

  <main class="contenedor-principal">
    <!-- SECCIÓN DE GENERADOR -->
    <section id="scriptgen" class="seccion-caja">
      <h2>📦 Generador de Script Personalizado (.sh)</h2>
      
      <!-- Selector de Modo -->
      <div class="mode-selector">
        <label class="mode-btn"><input type="radio" name="mode" value="noroot" checked onchange="actualizarOpciones()"> Modo No-Root (ADB/Brevent)</label>
        <label class="mode-btn"><input type="radio" name="mode" value="root" onchange="actualizarOpciones()"> Modo Root (Avanzado)</label>
      </div>

      <div id="containerOpciones" class="script-builder-box">
        <!-- Las opciones se cargan dinámicamente por JS -->
      </div>

      <button onclick="generarYDescargarScript()" class="btn-calcular" style="margin-top: 15px;">📥 DESCARGAR SCRIPT (.SH)</button>
    </section>
  </main>

  <!-- Modales igual que antes... -->
  <script src="script.js"></script>
</body>
</html>
